<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

console.log('radio-v2.html build check: chassis metalness=0.48 envMapIntensity=0.16-0.17, antenna icon size=0.9, camera z=13');

// ── Renderer ───────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;
document.body.appendChild(renderer.domElement);

// ── Scene + Camera ─────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeceef0);
scene.fog = new THREE.Fog(0xeceef0, 20, 45);

// Environment map — HDR gives the metal body real reflections (metalness needs this).
// Linear HDR data — no colorSpace set, three.js auto-converts the equirect to a PMREM-style
// cubeUV map internally once assigned to scene.environment.
new HDRLoader().load('monochrome.hdr', (hdrTexture) => {
  hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = hdrTexture;
}, undefined, (err) => {
  // Common failure: opening this file directly via file:// — fetch() for local files
  // is blocked by the browser, so the HDR silently never loads. Lighting doesn't
  // depend on it, but reflections will look flatter without it.
  console.error('monochrome.hdr failed to load — serve this folder over http(s) if you need env reflections.', err);
});

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 80);
camera.position.set(0, 0.4, 13);

// Keep the HORIZONTAL framing constant across window shapes — on a narrower/shorter
// window (e.g. a laptop screen vs. a wide desktop monitor), widen the vertical FOV
// instead of letting the scene's horizontal extent shrink, which is what was pushing
// the antenna sideways into the "Experience" text box.
const BASE_FOV_DEG = 40;     // vertical FOV tuned at BASE_ASPECT — a bit wider than the original 36°
                              // so there's always headroom above the antenna, on every screen shape
const BASE_ASPECT  = 1.9;    // ~widescreen desktop reference
const baseHalfVFov = BASE_FOV_DEG * Math.PI / 360;
const baseHalfHFov = Math.atan(Math.tan(baseHalfVFov) * BASE_ASPECT);

function fitCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  camera.aspect = aspect;
  camera.fov = aspect < BASE_ASPECT
    ? Math.atan(Math.tan(baseHalfHFov) / aspect) * 360 / Math.PI
    : BASE_FOV_DEG;
  camera.updateProjectionMatrix();
}
fitCamera();

// ── Post-processing — bloom on the glowing screen ───────────────────────────
// High threshold so only the bright screen/emissive accents bloom; polished metal
// speculars and the rest of the scene stay clean instead of washing out.
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.04,   // strength
  0.2,    // radius
  0.98    // threshold
);
composer.addPass(bloomPass);

// Scene rig — radio, mixer, figure, cable, plugs and the screen-glow light all live
// here so the whole composition can be shifted together as one unit.
const sceneRig = new THREE.Group();
scene.add(sceneRig);
sceneRig.position.x = -1.0;

// ── Lights — three-point (key / fill / rim). Direct lights + ambient carry the visible
// lighting on their own; the HDR environment only adds reflection detail on top, so the
// scene still reads correctly if monochrome.hdr fails to load (e.g. opened via file://,
// where fetch() for local files is blocked by the browser).
scene.add(new THREE.AmbientLight(0xfff8f0, 0.7));

// Key — warm, the main shadow-casting light
const keyLight = new THREE.DirectionalLight(0xfff0df, 0.7);
keyLight.position.set(4, 9, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.setScalar(4096);
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 25;
keyLight.shadow.bias = -0.0006;
scene.add(keyLight);

// Fill — cool, lower intensity, positioned opposite the key, no shadow
const fillLight = new THREE.DirectionalLight(0xbfd9ff, 0.3);
fillLight.position.set(-5, 5, 4);
scene.add(fillLight);

// Rim — from behind/above, separates the model silhouette from the background
const rimLight = new THREE.DirectionalLight(0xcfe6ff, 0.15);
rimLight.position.set(0, 7, -8);
scene.add(rimLight);

const screenGlow = new THREE.PointLight(0x00ff88, 0, 6);
screenGlow.position.set(-0.7, 0.8, 2);   // follows the radio's screen
sceneRig.add(screenGlow);

// ── Shared geometries + materials ──────────────────────────────────────────
// Chassis — main body + edge trim: metalness 0.85-0.9, roughness 0.2-0.25
// envMapIntensity kept low — monochrome.hdr has a hot bright spot (luminance ~39 vs a
// ~0.35 median) that mirrors harshly across low-roughness metal otherwise.
const bodyMat = new THREE.MeshStandardMaterial({
  color: 0x9b9ba2,
  roughness: 0.48,
  metalness: 0.48,
  envMapIntensity: 0.16,
});
const edgeMat = new THREE.MeshStandardMaterial({
  color: 0xb4b4bc,
  roughness: 0.46,
  metalness: 0.48,
  envMapIntensity: 0.17,
});
// Antenna/trim — brighter, more polished: metalness 0.85-0.9, roughness ~0.2
const metalMat = new THREE.MeshStandardMaterial({
  color: 0x8899aa,
  roughness: 0.2,
  metalness: 0.88,
  envMapIntensity: 0.4,
});
const darkMat = new THREE.MeshStandardMaterial({
  color: 0x0e0e1a,
  roughness: 0.9,
  metalness: 0.12,
  envMapIntensity: 0.02,
});

// ── Radio group ────────────────────────────────────────────────────────────
const radio = new THREE.Group();
radio.scale.setScalar(0.78);
radio.position.x = 0.2;   // shifted right; the figure sits back-left
sceneRig.add(radio);

// Body — slightly taller than before (3.9 → 4.6) for more vertical space
const bodyMesh = new THREE.Mesh(new RoundedBoxGeometry(5.8, 4.6, 1.3, 10, 0.28), bodyMat);
bodyMesh.castShadow = true;
bodyMesh.receiveShadow = true;
radio.add(bodyMesh);

// Edge strips (top + bottom) — repositioned for new height
[-2.18, 2.18].forEach(y => {
  const strip = new THREE.Mesh(new RoundedBoxGeometry(5.6, 0.22, 1.2, 6, 0.08), edgeMat);
  strip.position.y = y;
  strip.castShadow = true;
  radio.add(strip);
});

// Side rails (left + right) — taller to match body
[-2.78, 2.78].forEach(x => {
  const rail = new THREE.Mesh(new RoundedBoxGeometry(0.12, 4.36, 1.18, 6, 0.05), edgeMat);
  rail.position.x = x;
  rail.castShadow = true;
  radio.add(rail);
});

// Antenna — base repositioned to new body top (y=2.3)
const antBase = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.11, 0.3, 14), metalMat);
antBase.position.set(2.3, 2.45, 0);   // center at body_top(2.3) + half_height(0.15)
antBase.castShadow = true;
radio.add(antBase);

// rotation.z = -0.14 leans stick outward. bottom at (2.3, 2.60) = top of antBase.
// bottom_offset = rotate(0,-1.1,0) by z=-0.14 → (-0.1535, -1.089)
// center = (2.3+0.1535, 2.60+1.089) = (2.453, 3.689)
const antStick = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.05, 2.2, 10), metalMat);
antStick.position.set(2.453, 3.689, 0);
antStick.rotation.z = -0.14;
antStick.castShadow = true;
radio.add(antStick);

// (divider removed)

// ── Screen ─────────────────────────────────────────────────────────────────
const SW = 512, SH = 290;
const screenCanvas = document.createElement('canvas');
screenCanvas.width = SW; screenCanvas.height = SH;
const sCtx = screenCanvas.getContext('2d');
const screenTex = new THREE.CanvasTexture(screenCanvas);

let isPlaying = false;

// ── Audio ───────────────────────────────────────────────────────────────────
// Main thought audio — started/paused by PLAY, looped by LOOP, volume by slider
const thoughtAudio = new Audio('I am not good enough.wav');
thoughtAudio.preload = 'auto';
thoughtAudio.volume = 0.5;

// Pitch-shifted variant — started/paused by the PITCH button, same loop/volume behaviour
const pitchAudio = new Audio('I am not good enough pitch.wav');
pitchAudio.preload = 'auto';
pitchAudio.volume = 0.5;

// Whichever of the two was chosen last — LOOP acts on this one, so looping
// "follows" the currently chosen file rather than being tied to just PLAY.
let currentAudio = thoughtAudio;

function stopAudio(audio) {
  audio.pause();
  audio.currentTime = 0;
}

// Reset PLAY / PITCH button visuals — used on natural end-of-file and on ESC
function setPlayUIOff() {
  playBtn.position.z = BTN_Z_UP;
  playIcon.position.z = BTN_Z_UP + 0.16;
  playBtn.material.emissive.setHex(0x00963c);
}
function setPitchUIOff() {
  const pitchBtn = effectBtns.find(b => b.ec.label === 'PITCH');
  pitchBtn.active = false;
  pitchBtn.cap.position.z = BTN_Z_UP;
  pitchBtn.cap.material.emissive.setHex(pitchBtn.ec.emissive);
}

// When a file finishes (and loop is off), reset the play state visually
function onAudioEnded(audio) {
  if (audio.loop) return;
  if (audio === thoughtAudio) setPlayUIOff();
  else setPitchUIOff();
  isPlaying = false;
  screenGlow.intensity = 0;
  redrawScreen();
}
thoughtAudio.addEventListener('ended', () => onAudioEnded(thoughtAudio));
pitchAudio.addEventListener('ended', () => onAudioEnded(pitchAudio));

// ESC stops whichever file is playing
window.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  stopAudio(thoughtAudio);
  stopAudio(pitchAudio);
  setPlayUIOff();
  setPitchUIOff();
  isPlaying = false;
  screenGlow.intensity = 0;
  redrawScreen();
});

// Thoughts to cycle through with ◄ ► arrows
const THOUGHTS = [
  'I am not good enough',
  'I will never succeed',
  'Nobody understands me',
  'I am a failure',
  'I don\'t deserve this',
  'I am too much',
  'I am not worthy of love',
];
let thoughtIdx = 0;

function redrawScreen() {
  const glow = isPlaying ? 0.22 : 0.10;
  const dimC  = isPlaying ? '#00ffcc' : '#00dd88';
  const dimS  = isPlaying ? '#00ffaa' : '#00cc77';

  // Background
  const bg = sCtx.createRadialGradient(SW/2, SH/2, 8, SW/2, SH/2, 260);
  bg.addColorStop(0, isPlaying ? '#002218' : '#001510');
  bg.addColorStop(1, '#000500');
  sCtx.fillStyle = bg;
  sCtx.fillRect(0, 0, SW, SH);

  // Scanlines
  for (let y = 0; y < SH; y += 3) {
    sCtx.fillStyle = 'rgba(0,0,0,0.30)';
    sCtx.fillRect(0, y, SW, 1);
  }

  // Centre glow wash
  const wash = sCtx.createRadialGradient(SW/2, SH*0.62, 0, SW/2, SH*0.62, 230);
  wash.addColorStop(0, `rgba(0,255,136,${glow})`);
  wash.addColorStop(1, 'rgba(0,255,136,0)');
  sCtx.fillStyle = wash;
  sCtx.fillRect(0, 0, SW, SH);

  sCtx.save();

  // ── Top-left: channel info (lowered) ──────────────────────────────────────
  sCtx.shadowColor = dimS;
  sCtx.shadowBlur = isPlaying ? 12 : 6;
  sCtx.fillStyle = isPlaying ? 'rgba(0,255,180,0.78)' : 'rgba(0,210,130,0.62)';
  sCtx.font = 'bold 18px "Courier New", Courier, monospace';
  sCtx.textAlign = 'left';
  sCtx.textBaseline = 'top';
  sCtx.fillText('Channel: MIND radio, Always on!', 25, 26);

  // Thin separator under channel line
  sCtx.strokeStyle = isPlaying ? 'rgba(0,255,136,0.28)' : 'rgba(0,200,100,0.18)';
  sCtx.lineWidth = 1;
  sCtx.beginPath();
  sCtx.moveTo(14, 54); sCtx.lineTo(SW - 14, 54);
  sCtx.stroke();

  // ── "Negative thought of the day:" label (raised) ─────────────────────────
  sCtx.shadowBlur = isPlaying ? 16 : 8;
  sCtx.fillStyle = isPlaying ? 'rgba(0,255,190,0.82)' : 'rgba(0,220,140,0.65)';
  sCtx.font = 'italic 20px "Courier New", Courier, monospace';
  sCtx.textAlign = 'center';
  sCtx.textBaseline = 'middle';
  sCtx.fillText('Negative thought of the day:', SW / 2, 122);

  // ── Main thought (raised) — distorts while audio plays ────────────────────
  const TY = 176;
  sCtx.font = 'bold 29px "Courier New", Courier, monospace';
  sCtx.textAlign = 'center';
  sCtx.textBaseline = 'middle';
  const thought = THOUGHTS[thoughtIdx];

  if (isPlaying) {
    const t = Date.now();
    const jx = Math.sin(t * 0.021) * 2 + (Math.random() - 0.5) * 3;
    const spike = Math.random() < 0.12 ? (Math.random() - 0.5) * 16 : 0;
    // Chromatic split — red and cyan ghosts pulled apart
    sCtx.shadowBlur = 0;
    sCtx.fillStyle = 'rgba(255,40,90,0.55)';
    sCtx.fillText(thought, SW / 2 - 3 + jx + spike, TY + (Math.random() - 0.5) * 2.5);
    sCtx.fillStyle = 'rgba(0,190,255,0.55)';
    sCtx.fillText(thought, SW / 2 + 3 - jx, TY - (Math.random() - 0.5) * 2.5);
    // Main glowing pass on top
    sCtx.shadowColor = dimS;
    sCtx.shadowBlur = 30;
    sCtx.fillStyle = dimC;
    sCtx.fillText(thought, SW / 2 + jx * 0.4, TY);
    // Horizontal slice displacement — VHS tear through the text
    if (Math.random() < 0.4) {
      const sliceY = TY - 18 + Math.random() * 36;
      const sliceH = 3 + Math.random() * 7;
      const shift  = (Math.random() - 0.5) * 34;
      const strip = sCtx.getImageData(0, sliceY, SW, sliceH);
      sCtx.putImageData(strip, shift, sliceY);
    }
  } else {
    sCtx.shadowColor = dimS;
    sCtx.shadowBlur = 14;
    sCtx.fillStyle = dimC;
    sCtx.fillText(thought, SW / 2, TY);
    sCtx.shadowBlur = 22;
    sCtx.fillText(thought, SW / 2, TY);  // double pass for glow
  }

  sCtx.restore();

  // Corner brackets
  sCtx.strokeStyle = `rgba(0,255,128,${isPlaying ? 0.55 : 0.28})`;
  sCtx.lineWidth = 2.5;
  sCtx.lineCap = 'square';
  const bs = 22, bp = 10;
  [[bp,bp,1,1],[SW-bp,bp,-1,1],[bp,SH-bp,1,-1],[SW-bp,SH-bp,-1,-1]].forEach(([x,y,sx,sy]) => {
    sCtx.beginPath();
    sCtx.moveTo(x + sx * bs, y);
    sCtx.lineTo(x, y);
    sCtx.lineTo(x, y + sy * bs);
    sCtx.stroke();
  });

  // Blinking cursor when playing (after main thought)
  if (isPlaying) {
    const t = Date.now() * 0.003;
    if (Math.sin(t) > 0) {
      sCtx.font = 'bold 29px "Courier New", Courier, monospace';
      const tw = sCtx.measureText(thought).width;
      sCtx.fillStyle = 'rgba(0,255,136,0.8)';
      sCtx.fillRect(SW/2 + tw/2 + 6, 162, 9, 28);
    }
  }

  screenTex.needsUpdate = true;
}
redrawScreen();

// Screen bezel — taller to match new canvas (SH=290, aspect≈1.766:1)
const bezel = new THREE.Mesh(
  new RoundedBoxGeometry(3.4, 2.0, 0.14, 6, 0.1),
  new THREE.MeshStandardMaterial({ color: 0x0c0c1c, roughness: 0.92, metalness: 0.08 })
);
bezel.position.set(-0.5, 1.12, 0.6);
radio.add(bezel);

// Screen plane — height = width * (SH/SW) = 3.18 * (290/512) ≈ 1.80
const screenMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(3.18, 1.80),
  new THREE.MeshBasicMaterial({ map: screenTex })
);
screenMesh.position.set(-0.5, 1.12, 0.69);
radio.add(screenMesh);

// ── Speaker grille ─────────────────────────────────────────────────────────
const SPEAKER_X = 2.05;
const SPEAKER_Y = 0.7 + 2.2 * 0.15;   // moved up 15% of the grille's own height (2.2)

const grilleBg = new THREE.Mesh(
  new RoundedBoxGeometry(1.4, 2.2, 0.1, 6, 0.14),
  new THREE.MeshStandardMaterial({ color: 0x0d0d1c, roughness: 0.96, metalness: 0.06 })
);
grilleBg.position.set(SPEAKER_X, SPEAKER_Y, 0.59);
radio.add(grilleBg);

// Dot grid (speaker holes)
const dotGeo = new THREE.CircleGeometry(0.055, 8);
const dotMat = new THREE.MeshBasicMaterial({ color: 0x060610 });
for (let row = -5; row <= 5; row++) {
  for (let col = -2; col <= 2; col++) {
    const dist = Math.abs(row) * 0.38 + Math.abs(col) * 0.55;
    if (dist > 2.55) continue;
    const dot = new THREE.Mesh(dotGeo, dotMat);
    dot.position.set(SPEAKER_X + col * 0.2, SPEAKER_Y + row * 0.2, 0.66);
    radio.add(dot);
  }
}

// Speaker ring
const spkRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.32, 0.055, 10, 36),
  new THREE.MeshStandardMaterial({ color: 0x555566, roughness: 0.25, metalness: 0.85 })
);
spkRing.position.set(SPEAKER_X, SPEAKER_Y, 0.63);
radio.add(spkRing);

const spkDome = new THREE.Mesh(
  new THREE.SphereGeometry(0.15, 16, 8, 0, Math.PI * 2, 0, Math.PI * 0.5),
  new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.7, metalness: 0.4 })
);
spkDome.position.set(SPEAKER_X, SPEAKER_Y, 0.63);
spkDome.rotation.x = -Math.PI / 2;
radio.add(spkDome);

// ── Shared button constants ────────────────────────────────────────────────
const BTN_Z_UP   = 0.73;   // cap protrudes prominently above housing mouth
const BTN_Z_DOWN = 0.61;   // cap recedes into socket when pressed

// Canvas label helper — engraved style, same as "Thought selection"
// (hexColor kept for signature compat)
function makeLabel(text, hexColor, x, y, z, w = 0.74, parent = radio) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 34;
  const cx = c.getContext('2d');
  cx.font = 'bold 17px "Courier New", monospace';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  // Catch-light below, dark recessed text on top — stamped-in-metal look
  cx.fillStyle = 'rgba(255,255,255,0.25)';
  cx.fillText(text, 64, 18.3);
  cx.fillStyle = 'rgba(0,0,0,1.0)';
  cx.fillText(text, 64, 17);
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, w * 34 / 128),   // height proportional to width
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true })
  );
  m.position.set(x, y, z);
  parent.add(m);
}

// Engraved label — dark recessed text with a light catch-light edge below,
// so it reads as stamped into the metal rather than printed on it
function makeEngravedLabel(text, x, y, z, w = 1.35) {
  const c = document.createElement('canvas');
  c.width = 320; c.height = 48;
  const cx = c.getContext('2d');
  cx.font = 'bold 27px "Courier New", monospace';
  cx.textAlign = 'right';   // right-aligned so the text ends exactly at the plane's right edge
  cx.textBaseline = 'middle';
  // Catch-light: bright edge offset downward (light from above hits groove's lower lip)
  cx.fillStyle = 'rgba(255,255,255,0.25)';
  cx.fillText(text, 318, 26);
  // Recessed dark text on top
  cx.fillStyle = 'rgba(0,0,0,1.0)';
  cx.fillText(text, 318, 24);
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, w * 48 / 320),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true })
  );
  m.position.set(x, y, z);
  radio.add(m);
}

// Shared soft-shadow texture for buttons (radial gradient, dark centre → clear edge)
const btnShadowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 8, 64, 64, 62);
  grad.addColorStop(0,    'rgba(0,0,0,0.40)');
  grad.addColorStop(0.55, 'rgba(0,0,0,0.20)');
  grad.addColorStop(1,    'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();

// Button factory — depth comes from material shading, no black frame.
// Two-tone cap texture — vertical left/right split, used by the mixer's split buttons.
function makeSplitTexture(hexA, hexB) {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#' + hexA.toString(16).padStart(6, '0');
  ctx.fillRect(0, 0, 32, 64);
  ctx.fillStyle = '#' + hexB.toString(16).padStart(6, '0');
  ctx.fillRect(32, 0, 32, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// `parent` defaults to the radio; the mixer passes its own group (same local
// layout works because both bodies are 1.3 deep with the front face at z=0.65).
function makeBtn(x, y, radius, color, emissiveHex, parent = radio) {
  // Soft fake drop shadow on the body face — offset down-left (key light is upper right)
  const drop = new THREE.Mesh(
    new THREE.PlaneGeometry(radius * 3.3, radius * 3.3),
    new THREE.MeshBasicMaterial({ map: btnShadowTex, transparent: true, depthWrite: false })
  );
  drop.position.set(x - 0.035, y - 0.07, 0.688);
  parent.add(drop);

  // Thin body-toned rim — trim ring, matte like the rest of the chassis
  const rim = new THREE.Mesh(
    new THREE.CylinderGeometry(radius + 0.062, radius + 0.062, 0.07, 32),
    new THREE.MeshStandardMaterial({ color: 0x5a5a62, roughness: 0.55, metalness: 0.3, envMapIntensity: 0.12 })
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.set(x, y, 0.648);
  parent.add(rim);

  // Cap — tapered so the edge is narrower than the base, giving a natural bevel highlight.
  // Matte plastic knob feel — low-moderate metalness keeps the colour saturated.
  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius * 1.08, 0.30, 40),
    new THREE.MeshStandardMaterial({
      color,
      roughness: 0.4,
      metalness: 0.3,
      emissive: new THREE.Color(emissiveHex),
      envMapIntensity: 0.5,   // low env reflection — white sheen desaturates colour
    })
  );
  cap.rotation.x = Math.PI / 2;
  cap.position.set(x, y, BTN_Z_UP);
  cap.castShadow = true;
  parent.add(cap);
  return cap;
}

function makeArcTexture(radius, lineWidth) {
  const c = document.createElement('canvas');

  const g = c.getContext('2d');
  g.strokeStyle = '#666670';
  g.lineCap = 'round';

  g.arc(22, 80, radius, -0.62, 0.62);

}

const ARC_DEFS = [[34, 7], [66, 8], [98, 9]];   // inner → outer, like radiating sound

function makeSignalIcon(parent, x, y, z, size, { flip = false, rotZ = 0, reversed = false } = {}) {
  const arcs = ARC_DEFS.map(([r, lw]) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(size, size),
      new THREE.MeshBasicMaterial({ map: makeArcTexture(r, lw), transparent: true })
    );
    m.position.set(x, y, z);
    if (flip) m.scale.x = -1;   // mirror: arcs open to the left
    m.rotation.z = rotZ;
    m.visible = false;
    parent.add(m);
    return m;
  });
  return { arcs, reversed };
}

function updateSignalIcon(icon, step) {
  const n = icon.arcs.length;
  icon.arcs.forEach((arc, i) => {
    const order = icon.reversed ? (n - 1 - i) : i;
    arc.visible = order <= step;
  });
}

// ── Interaction ────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let isDraggingSlider = false;
let prevPointerY = 0;          // kept for any future use
let sliderDragStartClientY = 0;
let sliderDragStartLocalY  = 0;

const effectCapMeshes = effectBtns.map(b => b.cap);
const mixerCapMeshes  = mixerBtns.map(b => b.cap);
const allHit = [sliderHandle, playBtn, loopBtn, prevThoughtBtn, nextThoughtBtn, ...effectCapMeshes, ...mixerCapMeshes];

// Buttons that light up brighter on hover — play, loop, the 4 effect buttons
// (pitch/robot/reverb/pan) and the thought-selection arrows.
const hoverCapMeshes = [playBtn, loopBtn, prevThoughtBtn, nextThoughtBtn, ...effectCapMeshes];
const HOVER_EMISSIVE_INTENSITY = 1.8;
let hoveredCap = null;

function raycastHit(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  mouse.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(allHit);
  return hits[0]?.object ?? null;
}

renderer.domElement.addEventListener('pointerdown', e => {
  const hit = raycastHit(e);
  if (!hit) return;

  // Volume slider — drag up/down
  if (hit === sliderHandle) {
    isDraggingSlider = true;
    sliderDragStartClientY = e.clientY;
    sliderDragStartLocalY  = volSlider.y;
    renderer.domElement.setPointerCapture(e.pointerId);
    renderer.domElement.style.cursor = 'ns-resize';
    sliderHandle.material.emissive.setHex(0x1a6633);
    return;
  }

  // Play button — starts / pauses the main thought audio
  if (hit === playBtn) {
    // Only one file plays at a time — stop pitch if it was the one running
    if (!pitchAudio.paused) {
      stopAudio(pitchAudio);
      setPitchUIOff();
    }
    currentAudio = thoughtAudio;
    isPlaying = !isPlaying;
    playBtn.position.z = isPlaying ? BTN_Z_DOWN : BTN_Z_UP;
    playIcon.position.z = playBtn.position.z + 0.16;
    playBtn.material.emissive.setHex(isPlaying ? 0x00cc55 : 0x00963c);
    screenGlow.intensity = isPlaying ? 1.2 : 0;
    thoughtAudio.loop = isLooping;
    if (isPlaying) thoughtAudio.play().catch(() => {});
    else thoughtAudio.pause();
    redrawScreen();
    return;
  }

  // Loop button — arms looping on whichever file was chosen last (PLAY or PITCH)
  if (hit === loopBtn) {
    isLooping = !isLooping;
    currentAudio.loop = isLooping;
    loopBtn.position.z = isLooping ? BTN_Z_DOWN : BTN_Z_UP;
    loopIcon.position.z = loopBtn.position.z + 0.16;
    loopBtn.material.emissive.setHex(isLooping ? 0x2288ff : 0x0066b4);
    return;
  }

  // Thought navigation arrows
  if (hit === prevThoughtBtn || hit === nextThoughtBtn) {
    const dir = hit === nextThoughtBtn ? 1 : -1;
    thoughtIdx = (thoughtIdx + dir + THOUGHTS.length) % THOUGHTS.length;
    // Brief press-down animation
    hit.position.z = BTN_Z_DOWN;
    setTimeout(() => { hit.position.z = BTN_Z_UP; }, 120);
    if (hit === prevThoughtBtn) prevArrowIcon.position.z = BTN_Z_DOWN + 0.16;
    else                        nextArrowIcon.position.z = BTN_Z_DOWN + 0.16;
    setTimeout(() => {
      prevArrowIcon.position.z = nextArrowIcon.position.z = BTN_Z_UP + 0.16;
    }, 120);
    redrawScreen();
    return;
  }

  // Effect buttons
  const ei = effectCapMeshes.indexOf(hit);
  if (ei >= 0) {
    const eb = effectBtns[ei];

    // PITCH plays its own audio file instead of just toggling a visual state
    if (eb.ec.label === 'PITCH') {
      // Only one file plays at a time — stop the main thought audio if it was running
      if (!thoughtAudio.paused) {
        stopAudio(thoughtAudio);
        setPlayUIOff();
      }
      currentAudio = pitchAudio;
      eb.active = !eb.active;
      isPlaying = eb.active;
      eb.cap.position.z = eb.active ? BTN_Z_DOWN : BTN_Z_UP;
      eb.cap.material.emissive.setHex(eb.active ? eb.ec.activeEm : eb.ec.emissive);
      screenGlow.intensity = eb.active ? 1.2 : 0;
      pitchAudio.loop = isLooping;
      if (eb.active) pitchAudio.play().catch(() => {});
      else pitchAudio.pause();
      redrawScreen();
      return;
    }

    eb.active = !eb.active;
    eb.cap.position.z = eb.active ? BTN_Z_DOWN : BTN_Z_UP;
    eb.cap.material.emissive.setHex(eb.active ? eb.ec.activeEm : eb.ec.emissive);
    return;
  }

  // Mixer buttons — same toggle behaviour as the effect buttons
  const mi = mixerCapMeshes.indexOf(hit);
  if (mi >= 0) {
    const mb = mixerBtns[mi];
    mb.active = !mb.active;
    mb.cap.position.z = mb.active ? BTN_Z_DOWN : BTN_Z_UP;
    if (mb.splitOff) {
      mb.cap.material.emissiveMap = mb.active ? mb.splitOn : mb.splitOff;
    } else {
      mb.cap.material.emissive.setHex(mb.active ? mb.ec.activeEm : mb.ec.emissive);
    }
  }
});

renderer.domElement.addEventListener('pointermove', e => {
  if (isDraggingSlider) {
    // Absolute delta from drag-start — works reliably in both directions
    const dy = -(e.clientY - sliderDragStartClientY) * (TRACK_H / 110);
    setSliderY(sliderDragStartLocalY + dy);
    return;
  }
  const hit = raycastHit(e);
  renderer.domElement.style.cursor = hit ? 'pointer' : 'default';

  // Hover glow — boost emissiveIntensity on the targeted cap, restore the rest
  const newHover = hoverCapMeshes.includes(hit) ? hit : null;
  if (newHover !== hoveredCap) {
    if (hoveredCap) hoveredCap.material.emissiveIntensity = 1;
    if (newHover) newHover.material.emissiveIntensity = HOVER_EMISSIVE_INTENSITY;
    hoveredCap = newHover;
  }
});

renderer.domElement.addEventListener('pointerup', () => {
  if (isDraggingSlider) {
    isDraggingSlider = false;
    renderer.domElement.style.cursor = 'default';
    sliderHandle.material.emissive.setHex(0x0a2e14);
  }
});

renderer.domElement.addEventListener('pointerleave', () => {
  if (hoveredCap) {
    hoveredCap.material.emissiveIntensity = 1;
    hoveredCap = null;
  }
  renderer.domElement.style.cursor = 'default';
});

// ── Resize ─────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  fitCamera();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ── Animation loop ──────────────────────────────────────────────────────────
let lastScreenRedraw = 0;
const SIGNAL_STEP_MS = 450;

renderer.setAnimationLoop(time => {

  // Radio rests on the floor — no float animation

  // Screen pulse when playing
  if (isPlaying) {
    const pulse = 0.9 + Math.sin(time * 0.0028) * 0.1;
    screenGlow.intensity = 1.2 * pulse;
    // Fast redraw while playing — animates the glitch distortion (+ cursor blink)
    if (time - lastScreenRedraw > 80) {
      lastScreenRedraw = time;
      redrawScreen();
    }
  }

  // Subtle slider handle emissive breathing
  if (!isDraggingSlider) {
    sliderHandle.material.emissiveIntensity = 0.05 + Math.sin(time * 0.001) * 0.025;
  }

  // Signal icons — arcs fill up one at a time, looping
  const signalStep = Math.floor(time / SIGNAL_STEP_MS) % 3;
  updateSignalIcon(jarSignal, signalStep);
  updateSignalIcon(antennaSignal, signalStep);

  // Zoom-into-screen transition — dives the camera through the screen, fades out,
  // then hands off to the "inside the radio" page.
  if (isZoomTransitioning) {
    const t = Math.min((performance.now() - zoomTransitionStart) / ZOOM_TRANSITION_MS, 1);
    const ease = t * t;   // accelerating dive
    camera.position.z = THREE.MathUtils.lerp(7, 0.3, ease);
    camera.fov = THREE.MathUtils.lerp(zoomTransitionFov, 75, ease);
    camera.updateProjectionMatrix();
    zoomFadeEl.style.opacity = t;
    if (t >= 1) {
      window.location.href = 'inside.html';
    }
  }

  composer.render();
});

// Debug hook (harmless in production — read-only state inspection)
window.__radioState = () => ({
  isPlaying, isLooping, thoughtIdx,
  volume: thoughtAudio.volume,
  playBtnZ: playBtn.position.z,
});
</script>
</body>
