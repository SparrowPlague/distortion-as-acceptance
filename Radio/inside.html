<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inside</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #23252a; overflow: hidden; }
  canvas { display: block; }
  #go-back {
    position: fixed;
    bottom: 48px;
    left: 48px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }
  #go-back .circle {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.08);
    transition: background 0.2s;
  }
  #go-back:hover .circle {
    background: rgba(255,255,255,0.22);
  }
  #go-back span {
    color: #fff;
    font: 500 13px/1 'Courier New', monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="go-back">
  <div class="circle"></div>
  <span>Go back</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

// ── Renderer ───────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

// ── Scene + Camera ─────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x23252a);
scene.fog = new THREE.Fog(0x23252a, 14, 32);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 80);
camera.position.set(2, 5.0, 8);
camera.lookAt(-2, 2.5, -3);

// Environment map — reuses the same HDR as the radio scene, for PBR reflections
// on the metal-ish room surfaces. Linear HDR data — no colorSpace set.
new HDRLoader().load('monochrome.hdr', (hdrTexture) => {
  hdrTexture.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = hdrTexture;
}, undefined, (err) => {
  console.error('monochrome.hdr failed to load — serve this folder over http(s) for env reflections.', err);
});

// ── Lights — ambient + three-point ──────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xcfd6dd, 0.5));

// Key — the main shadow-casting light
const keyLight = new THREE.DirectionalLight(0xfff3e6, 1.3);
keyLight.position.set(5, 9, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.setScalar(2048);
keyLight.shadow.camera.left = -12;
keyLight.shadow.camera.right = 12;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -12;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.bias = -0.0006;
scene.add(keyLight);

// Fill — cooler, lower intensity, opposite side, no shadow
const fillLight = new THREE.DirectionalLight(0xbfd9ff, 0.5);
fillLight.position.set(-6, 5, 5);
scene.add(fillLight);

// Rim — separates the walls/floor edges from the background
const rimLight = new THREE.DirectionalLight(0xcfe6ff, 0.6);
rimLight.position.set(-4, 6, -8);
scene.add(rimLight);

// ── Materials — metal-ish, PBR, tuned conservatively to avoid blown-out specular ─
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x8a8d92,
  roughness: 0.5,
  metalness: 0.55,
  envMapIntensity: 0.5,
});
const wallMat = new THREE.MeshStandardMaterial({
  color: 0x82858a,
  roughness: 0.55,
  metalness: 0.5,
  envMapIntensity: 0.45,
});

// ── Room — floor, back wall, left wall (open corner) ────────────────────────
// Floor/back wall extend further right than before (left edge stays fixed where the
// left wall is) — the room wasn't wide enough on the right, exposing the void.
const ROOM_LEFT_X = -8, ROOM_RIGHT_X = 16;
const ROOM_WIDTH = ROOM_RIGHT_X - ROOM_LEFT_X;
const ROOM_CENTER_X = (ROOM_LEFT_X + ROOM_RIGHT_X) / 2;
const ROOM_DEPTH = 16, ROOM_HEIGHT = 10;

const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_DEPTH), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set(ROOM_CENTER_X, 0, -ROOM_DEPTH / 2 + 8);
floor.receiveShadow = true;
scene.add(floor);

const backWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_HEIGHT), wallMat);
backWall.position.set(ROOM_CENTER_X, ROOM_HEIGHT / 2, -8);
backWall.receiveShadow = true;
scene.add(backWall);

const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_DEPTH, ROOM_HEIGHT), wallMat);
leftWall.rotation.y = Math.PI / 2;
leftWall.position.set(ROOM_LEFT_X, ROOM_HEIGHT / 2, 0);
leftWall.receiveShadow = true;
scene.add(leftWall);

// Set once the REC button's material loads (inside the Ableton logo callback
// below) — the animation loop pulses its emissiveIntensity to read as "recording".
let recMaterial = null;

// ── Ableton logo — mounted on the left wall, with an L/R channel indicator
// underneath (same dot + label styling as the speaker's L/R indicator below).
// Wall plane is rotated +90° around Y, so its local +X (the texture's right
// edge) maps to world -Z — that also happens to be the viewer's right hand
// when facing the wall, so the logo reads un-mirrored with no extra flip.
const ABLETON_X             = ROOM_LEFT_X + 0.05;   // just off the wall, interior side
const ABLETON_LOGO_Z        = -2;                   // position along the wall's depth
const ABLETON_LR_Y          = ROOM_HEIGHT * 0.10;   // L/R row — 10% up from the floor
const ABLETON_LOGO_GAP      = 0.45;                 // small clearance between logo bottom and the row
const ABLETON_LOGO_W        = 2.8;

const ABLETON_LR_GAP    = 0.36;
const ABLETON_LR_RADIUS = 0.08;
const abletonLeftDotZ  = ABLETON_LOGO_Z + ABLETON_LR_GAP / 2;   // viewer's left
const abletonRightDotZ = ABLETON_LOGO_Z - ABLETON_LR_GAP / 2;   // viewer's right

new THREE.TextureLoader().load('abletonlogo.png', (tex) => {
  const img = tex.image;

  // The PNG is a 700x700 canvas with the mark centered in a transparent margin.
  // Trim that margin so the plane hugs the visible artwork — otherwise the dead
  // space at the bottom keeps the logo looking far from the L/R row below it
  // no matter how small ABLETON_LOGO_GAP is set.
  const off = document.createElement('canvas');
  off.width = img.width; off.height = img.height;
  const octx = off.getContext('2d');
  octx.drawImage(img, 0, 0);
  const data = octx.getImageData(0, 0, img.width, img.height).data;
  let minX = img.width, minY = img.height, maxX = 0, maxY = 0;
  for (let y = 0; y < img.height; y++) {
    for (let x = 0; x < img.width; x++) {
      if (data[(y * img.width + x) * 4 + 3] > 10) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  const cropW = maxX - minX + 1;
  const cropH = maxY - minY + 1;

  tex.colorSpace = THREE.SRGBColorSpace;
  tex.repeat.set(cropW / img.width, cropH / img.height);
  tex.offset.set(minX / img.width, 1 - (maxY + 1) / img.height);
  tex.needsUpdate = true;

  const aspect = cropW / cropH;
  const logoH = ABLETON_LOGO_W / aspect;

  // A plain white-on-black mask of the logo's silhouette, for the hover glow.
  // Using the base texture itself as the emissiveMap doesn't work — the logo's
  // artwork is black, so emissive(white) * emissiveMap(black) is still black
  // no matter the intensity. This mask is white wherever the artwork is opaque.
  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = cropW; maskCanvas.height = cropH;
  const mctx = maskCanvas.getContext('2d');
  const maskData = mctx.createImageData(cropW, cropH);
  for (let y = 0; y < cropH; y++) {
    for (let x = 0; x < cropW; x++) {
      const a = data[((y + minY) * img.width + (x + minX)) * 4 + 3];
      const v = a > 10 ? 255 : 0;
      const di = (y * cropW + x) * 4;
      maskData.data[di] = v; maskData.data[di + 1] = v; maskData.data[di + 2] = v; maskData.data[di + 3] = 255;
    }
  }
  mctx.putImageData(maskData, 0, 0);
  const glowTex = new THREE.CanvasTexture(maskCanvas);

  const logo = new THREE.Mesh(
    new THREE.PlaneGeometry(ABLETON_LOGO_W, logoH),
    new THREE.MeshStandardMaterial({
      map: tex,
      transparent: true,
      roughness: 1,
      metalness: 0,
      emissive: new THREE.Color(0xffffff),
      emissiveMap: glowTex,
      emissiveIntensity: 0,   // toggled on hover — see hoverTargets below
    })
  );
  logo.rotation.y = Math.PI / 2;
  logo.position.set(ABLETON_X, ABLETON_LR_Y + ABLETON_LOGO_GAP + logoH / 2, ABLETON_LOGO_Z);
  logo.userData.emissiveMapGlow = true;
  logo.userData.baseOpacity = 1;
  scene.add(logo);
  hoverTargets.push(logo);

  const abletonLRY = ABLETON_LR_Y;
  const abletonDotGeo = new THREE.CircleGeometry(ABLETON_LR_RADIUS, 16);
  const abletonDotMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.5, metalness: 0.2 });

  const abletonLeftDot = new THREE.Mesh(abletonDotGeo, abletonDotMat);
  abletonLeftDot.rotation.y = Math.PI / 2;
  abletonLeftDot.position.set(ABLETON_X, abletonLRY, abletonLeftDotZ);
  scene.add(abletonLeftDot);

  const abletonRightDot = new THREE.Mesh(abletonDotGeo, abletonDotMat);
  abletonRightDot.rotation.y = Math.PI / 2;
  abletonRightDot.position.set(ABLETON_X, abletonLRY, abletonRightDotZ);
  scene.add(abletonRightDot);

  function makeAbletonLRLabel(text, z) {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const cx = c.getContext('2d');
    cx.font = 'bold 44px "Courier New", monospace';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillStyle = 'rgba(255,255,255,0.3)';
    cx.fillText(text, 32, 35);
    cx.fillStyle = 'rgba(0,0,0,1.0)';
    cx.fillText(text, 32, 32);
    const label = new THREE.Mesh(
      new THREE.PlaneGeometry(0.22, 0.22),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true })
    );
    label.rotation.y = Math.PI / 2;
    label.position.set(ABLETON_X, abletonLRY, z);
    scene.add(label);
  }

  makeAbletonLRLabel('L', abletonLeftDotZ + 0.25);
  makeAbletonLRLabel('R', abletonRightDotZ - 0.25);

  // ── REC button — 3D, above the logo, left-aligned with it, glowing red like
  // an active recording light (see the pulse in the animation loop below).
  const REC_RADIUS = 0.32;
  const REC_GAP    = 0.4;   // clearance between the logo's top and the button
  const logoTopY  = ABLETON_LR_Y + ABLETON_LOGO_GAP + logoH;
  const logoLeftZ = ABLETON_LOGO_Z + ABLETON_LOGO_W / 2;   // logo's left edge (viewer's left = +Z on this wall)
  const recCenterZ = logoLeftZ - REC_RADIUS;               // REC button's left edge matches the logo's
  const recCenterY = logoTopY + REC_GAP + REC_RADIUS;

  // A real push-button, not a flat disc — tapered cylinder, no ring/frame.
  // Cylinder axis defaults to local Y; rotation.z=-90° swings that to world +X
  // (out of the wall), same way the radio's own buttons rotate onto their axis.
  const REC_THICKNESS = 0.18;
  const recCylX = ROOM_LEFT_X + 0.05 + REC_THICKNESS / 2;

  const recMat = new THREE.MeshStandardMaterial({
    color: 0x8a0000,
    roughness: 0.35,
    metalness: 0.3,
    emissive: new THREE.Color(0xff1a1a),
    emissiveIntensity: 1.4,
  });
  const recButton = new THREE.Mesh(
    new THREE.CylinderGeometry(REC_RADIUS, REC_RADIUS * 1.08, REC_THICKNESS, 48),
    recMat
  );
  recButton.rotation.z = -Math.PI / 2;
  recButton.position.set(recCylX, recCenterY, recCenterZ);
  recButton.castShadow = true;
  scene.add(recButton);
  recMaterial = recMat;   // picked up by the pulse animation below

  const recLabelCanvas = document.createElement('canvas');
  recLabelCanvas.width = 256; recLabelCanvas.height = 256;
  const rlx = recLabelCanvas.getContext('2d');
  rlx.font = '900 76px "Arial Black", Arial, sans-serif';
  rlx.textAlign = 'center';
  rlx.textBaseline = 'middle';
  rlx.fillStyle = '#ffffff';
  rlx.fillText('REC', 128, 128);
  const recLabel = new THREE.Mesh(
    new THREE.PlaneGeometry(REC_RADIUS * 1.3, REC_RADIUS * 1.3),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(recLabelCanvas), transparent: true })
  );
  recLabel.rotation.y = Math.PI / 2;
  recLabel.position.set(recCylX + REC_THICKNESS / 2 + 0.01, recCenterY, recCenterZ);
  scene.add(recLabel);

  // ── Cables — white from L, red from R, running from the left wall across
  // the floor to the circuit board, tucking their ends in near its centre so
  // they read as plugged into the board (behind whatever sits there).
  function makeAbletonWire(startZ, waypoints, color) {
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(ROOM_LEFT_X + 0.08, abletonLRY, startZ),   // exits from the centre of the dot
      ...waypoints.map(p => new THREE.Vector3(p[0], p[1], p[2])),
    ]);
    const wire = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 48, 0.035, 8),
      new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3 })
    );
    wire.castShadow = true;
    wire.receiveShadow = true;
    scene.add(wire);

    const connector = new THREE.Mesh(
      new THREE.CircleGeometry(0.06, 16),
      new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.5, metalness: 0.2 })
    );
    connector.rotation.y = Math.PI / 2;
    connector.position.set(ROOM_LEFT_X + 0.06, abletonLRY, startZ);
    scene.add(connector);
  }

  // White — from L, tucks in just behind/left of board centre
  makeAbletonWire(abletonLeftDotZ, [
    [-7.5, 0.55, abletonLeftDotZ - 0.2],
    [-5.0, 0.9,  -2.3],
    [-3.0, 0.55, -2.8],
    [BOARD_X - 0.5, 0.35, BOARD_Z + 0.4],
  ], 0xe6e6e6);

  // Red — from R, tucks in just behind/right of board centre
  makeAbletonWire(abletonRightDotZ, [
    [-7.5, 0.5,  abletonRightDotZ + 0.2],
    [-5.2, 0.85, -2.0],
    [-3.2, 0.5,  -2.5],
    [BOARD_X + 0.5, 0.35, BOARD_Z - 0.2],
  ], 0xb03030);
}, undefined, (err) => {
  console.error('abletonlogo.png failed to load', err);
});

// ── Speaker grille — set into the back wall, left side, a bit clear of the
// left wall corner. No frame — just a clean dot grid sitting directly on the
// wall, with a metal ring + dome over the centre (echoes the radio's own
// speaker). Bottom sits 30% up from the floor, not flush with it.
const SPEAKER_PANEL_X      = -6.4;
const SPEAKER_PANEL_W      = 2.0;
const SPEAKER_PANEL_H      = 3.4;
const SPEAKER_PANEL_BOTTOM_Y = ROOM_HEIGHT * 0.45;
const SPEAKER_PANEL_CENTER_Y = SPEAKER_PANEL_BOTTOM_Y + SPEAKER_PANEL_H / 2;

// Dot grid (speaker holes) — evenly spaced, no jitter
const SPEAKER_DOT_COLS = 5, SPEAKER_DOT_ROWS = 9;
const SPEAKER_DOT_MARGIN_X = 0.2, SPEAKER_DOT_MARGIN_Y = 0.2;
const speakerDotGeo = new THREE.CircleGeometry(0.05, 12);
const speakerDotMat = new THREE.MeshBasicMaterial({ color: 0x060610 });
const speakerDotAreaW = SPEAKER_PANEL_W - SPEAKER_DOT_MARGIN_X * 2;
const speakerDotAreaH = SPEAKER_PANEL_H - SPEAKER_DOT_MARGIN_Y * 2;
for (let row = 0; row < SPEAKER_DOT_ROWS; row++) {
  for (let col = 0; col < SPEAKER_DOT_COLS; col++) {
    const px = SPEAKER_PANEL_X - speakerDotAreaW / 2 + (col + 0.5) * (speakerDotAreaW / SPEAKER_DOT_COLS);
    const py = SPEAKER_PANEL_BOTTOM_Y + SPEAKER_DOT_MARGIN_Y + (row + 0.5) * (speakerDotAreaH / SPEAKER_DOT_ROWS);
    const dot = new THREE.Mesh(speakerDotGeo, speakerDotMat);
    dot.position.set(px, py, -7.95);
    scene.add(dot);
  }
}

// Speaker ring + dome — sits in front of the grid, over its centre, same
// metal styling as the radio's own speaker ring/dome
const speakerRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.42, 0.07, 12, 40),
  new THREE.MeshStandardMaterial({ color: 0x555566, roughness: 0.25, metalness: 0.85 })
);
speakerRing.position.set(SPEAKER_PANEL_X, SPEAKER_PANEL_CENTER_Y, -7.93);
scene.add(speakerRing);

const speakerDome = new THREE.Mesh(
  new THREE.SphereGeometry(0.2, 16, 8, 0, Math.PI * 2, 0, Math.PI * 0.5),
  new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.7, metalness: 0.4 })
);
speakerDome.position.set(SPEAKER_PANEL_X, SPEAKER_PANEL_CENTER_Y, -7.93);
speakerDome.rotation.x = -Math.PI / 2;
scene.add(speakerDome);

// L/R channel indicator dots — below the grille, centred, a bit bigger than
// the grille holes (0.05) and spaced apart so they don't touch, with an L/R
// label right next to each one.
const SPEAKER_LR_Y      = SPEAKER_PANEL_BOTTOM_Y - 0.35;
const SPEAKER_LR_GAP    = 0.36;   // centre-to-centre spacing between the two dots
const SPEAKER_LR_RADIUS = 0.08;
const lrDotGeo = new THREE.CircleGeometry(SPEAKER_LR_RADIUS, 16);
const lrDotMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.5, metalness: 0.2 });
const leftDotX  = SPEAKER_PANEL_X - SPEAKER_LR_GAP / 2;
const rightDotX = SPEAKER_PANEL_X + SPEAKER_LR_GAP / 2;

const leftDot = new THREE.Mesh(lrDotGeo, lrDotMat);
leftDot.position.set(leftDotX, SPEAKER_LR_Y, -7.95);
scene.add(leftDot);

const rightDot = new THREE.Mesh(lrDotGeo, lrDotMat);
rightDot.position.set(rightDotX, SPEAKER_LR_Y, -7.95);
scene.add(rightDot);

function makeLRLabel(text, x, y) {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const cx = c.getContext('2d');
  cx.font = 'bold 44px "Courier New", monospace';
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.fillStyle = 'rgba(255,255,255,0.3)';
  cx.fillText(text, 32, 35);
  cx.fillStyle = 'rgba(0,0,0,1.0)';
  cx.fillText(text, 32, 32);
  const label = new THREE.Mesh(
    new THREE.PlaneGeometry(0.22, 0.22),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true })
  );
  label.position.set(x, y, -7.95);
  scene.add(label);
}

makeLRLabel('L', leftDotX - 0.25, SPEAKER_LR_Y);
makeLRLabel('R', rightDotX + 0.25, SPEAKER_LR_Y);

// ── Back-wall buttons — circle + torus frame + mirrored branded label, one per
// effect, spaced out to the left of the red PITCH one ───────────────────────
// Shifts the PCB, the back-wall buttons/labels and their connecting wires to
// the right by 5% of the room width, without touching the unrelated floor cables.
const BACKWALL_SHIFT_X = ROOM_WIDTH * 0.05;

const MARKER_X = 8 - 0.25 * 16 + BACKWALL_SHIFT_X;    // kept anchored to the original 16-wide back wall, not the extended floor
const MARKER_Y = 0.2 * ROOM_HEIGHT;
const MARKER_SPACING = 3.2;

function makeButtonMarker(x, y, color, label) {
  // Frame — a real torus instead of a flat ring, so it has actual depth/mass
  const frame = new THREE.Mesh(
    new THREE.TorusGeometry(0.55, 0.046, 16, 48),
    new THREE.MeshStandardMaterial({ color: 0x4a4a4e, roughness: 0.28, metalness: 0.8, envMapIntensity: 0.55 })
  );
  frame.position.set(x, y, -7.95);
  scene.add(frame);

  const circle = new THREE.Mesh(
    new THREE.CircleGeometry(0.50, 32),
    new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.35, envMapIntensity: 0.35 })
  );
  circle.position.set(x, y, -7.94);
  circle.userData.glowHex = color;   // hover target — lights up to its own hue
  scene.add(circle);

  // Branded label underneath — mirrored, engraved look (no glow, just grey/black)
  const brandTex = (() => {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 160;
    const g = c.getContext('2d');
    g.font = 'bold 92px "Courier New", monospace';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    // Catch-light below, fully-opaque dark recessed text on top — reads as
    // stamped/engraved into the metal rather than printed on it.
    g.fillStyle = 'rgba(255,255,255,0.3)';
    g.fillText(label, c.width / 2, c.height / 2 + 3);
    g.fillStyle = 'rgba(0,0,0,1.0)';
    g.fillText(label, c.width / 2, c.height / 2);
    return new THREE.CanvasTexture(c);
  })();
  const brand = new THREE.Mesh(
    new THREE.PlaneGeometry(1.3, 0.41),
    new THREE.MeshBasicMaterial({ map: brandTex, transparent: true })
  );
  brand.position.set(x, y - 0.95, -7.95);
  brand.scale.x = -1;   // mirrored
  scene.add(brand);

  return { frame, circle, x, y };
}

// ── Wires — one per button, from the centre of its circle down to the board ─
const BOARD_X = -3 + BACKWALL_SHIFT_X, BOARD_Z = -3;

function makeWire(startX, startY, midX, midY, midZ, endX, endY, endZ) {
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(startX, startY, -7.9),                 // exits from the centre of the circle
    new THREE.Vector3(startX - 0.25, startY - 0.55, -7.6),    // droops down naturally right at the attachment
    new THREE.Vector3(startX - 1.6, 1.2, -6.5),               // sweeps down off the wall
    new THREE.Vector3(midX, midY, midZ),                     // its own distinct route across the floor
    new THREE.Vector3(endX, endY, endZ),                      // ends near/under the board
  ]);
  const wire = new THREE.Mesh(

// ── Floor cables — front of the room, simulating loose internal radio wiring.
// Each cable is two fixed anchors (off-screen near the camera, off-screen through
// the bottom-left corner) with a smooth lateral wave relaxed through a small
// verlet-style distance-constraint solver — this removes sharp hand-placed kinks
// and lets the slack settle naturally, instead of an authored zig-zag path.
function relaxCable(waypoints, restHeight, segments, waveAmp, wavePhase, waveFreq) {
  // waypoints: [start, ...visible via-points..., end] as [x, z] pairs. The via-point
  // is required — a pure start→end relax between two off-screen anchors never dips
  // through the visible middle of the floor, which is why the cables vanished.
  const anchors = waypoints.map(p => new THREE.Vector3(p[0], restHeight, p[1]));
  const legLengths = [];
  let totalLen = 0;
  for (let i = 0; i < anchors.length - 1; i++) {
    const len = anchors[i + 1].distanceTo(anchors[i]);
    legLengths.push(len);
    totalLen += len;
  }

  const points = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const targetDist = t * totalLen;
    let acc = 0, legIndex = 0;
    while (legIndex < legLengths.length - 1 && acc + legLengths[legIndex] < targetDist) {
      acc += legLengths[legIndex];
      legIndex++;
    }
    const legT = legLengths[legIndex] > 0 ? (targetDist - acc) / legLengths[legIndex] : 0;
    const p = anchors[legIndex].clone().lerp(anchors[legIndex + 1], Math.min(Math.max(legT, 0), 1));

    const legDir = anchors[legIndex + 1].clone().sub(anchors[legIndex]).normalize();
    const lateral = new THREE.Vector3(-legDir.z, 0, legDir.x);
    const wave = Math.sin(t * Math.PI * waveFreq + wavePhase) * waveAmp * Math.sin(t * Math.PI);
    p.addScaledVector(lateral, wave);
    points.push(p);
  }

  const restLen = (totalLen * 1.04) / segments;   // slight slack so it can settle, not pull dead straight
  for (let iter = 0; iter < 120; iter++) {
    for (let i = 0; i < segments; i++) {
      const a = points[i], b = points[i + 1];
      const delta = b.clone().sub(a);
      const dist = delta.length();
      const corr = delta.multiplyScalar(0.5 * (dist - restLen) / dist);
      if (i !== 0) a.add(corr);
      if (i !== segments) b.sub(corr);
    }
    points[0].copy(anchors[0]);
    points[segments].copy(anchors[anchors.length - 1]);
    for (let i = 1; i < segments; i++) points[i].y = restHeight;   // stays resting on the floor
  }
  return points;
}

// ── PCB model — sits flat on the floor, centered in the room ────────────────
const pcbLoader = new GLTFLoader();
pcbLoader.setMeshoptDecoder(MeshoptDecoder);
pcbLoader.load('Circuitboard.glb', (gltf) => {
  const pcb = gltf.scene;

  // Auto-detect the thinnest axis (the board's thickness) and rotate it to vertical,
  // so the board lies flat regardless of how it was originally authored/exported.
  let size = new THREE.Box3().setFromObject(pcb).getSize(new THREE.Vector3());
  if (size.z <= size.x && size.z <= size.y) {
    pcb.rotation.x = -Math.PI / 2;
  } else if (size.x <= size.y && size.x <= size.z) {
    pcb.rotation.z = Math.PI / 2;
  }

  // Scale it up, then place it further back and to the left — closer to the camera
  // (near z=8) it was sitting low in frame and partly out of view
  size = new THREE.Box3().setFromObject(pcb).getSize(new THREE.Vector3());
  const targetFootprint = 5.5;
  pcb.scale.setScalar(targetFootprint / Math.max(size.x, size.z));

  const box = new THREE.Box3().setFromObject(pcb);
  const center = box.getCenter(new THREE.Vector3());
  pcb.position.x += BOARD_X - center.x;
  pcb.position.z += BOARD_Z - center.z;
  pcb.position.y -= box.min.y;   // sit flush on the floor (y=0)

  pcb.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });

  scene.add(pcb);

  // ── Cables — from two of the Buzzer's own mounting holes (its 6 "indents",
  // decoded straight from the GLB mesh — see BUZZER_HOLES_LOCAL below) up to
  // the L/R indicator dots below the speaker grille.
  //
  // These 6 positions are the actual hole centers read out of the raw
  // "Circle.019" mesh (the Buzzer's geometry), in the mesh's own local space
  // — i.e. the same space `pcb` is in *before* the rotation/scale/position
  // this loader applies above. Applying pcb.scale + pcb.position to them
  // (exactly the transform this callback already computed) lands them
  // exactly on the real holes, not an approximated corner of the bounding box.
  const BUZZER_HOLES_LOCAL = [
    [-0.01505, 0.01981,  0.00837],
    [-0.01505, 0.01981, -0.00591],
    [-0.03993, 0.01981, -0.00591],   // back-left hole (further back)
    [-0.03993, 0.01981,  0.00837],   // back-left hole (further front)
    [-0.02777, 0.01981,  0.01482],
    [-0.02777, 0.01981, -0.01313],
  ];
  function buzzerHoleWorldPos(idx) {
    const [x, y, z] = BUZZER_HOLES_LOCAL[idx];
    return new THREE.Vector3(x, y, z).multiplyScalar(pcb.scale.x).add(pcb.position);
  }

  function makeSpeakerCable(exitPos, midPoints, destX, color) {
    const curve = new THREE.CatmullRomCurve3([
      exitPos,
      ...midPoints.map(p => new THREE.Vector3(p[0], p[1], p[2])),
      new THREE.Vector3(destX + 0.035, SPEAKER_LR_Y, -7.9),   // nudged right to sit centred in the dot
    ]);
    const wire = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 48, 0.03, 8),
      new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3 })
    );
    wire.castShadow = true;
    wire.receiveShadow = true;
    scene.add(wire);
  }

  const whiteExit = buzzerHoleWorldPos(2);
  const redExit    = buzzerHoleWorldPos(3);

  // White — to L
  makeSpeakerCable(whiteExit, [
    [whiteExit.x - 1.3, whiteExit.y + 0.7, whiteExit.z - 1.4],
    [-4.6,               2.1,               -5.6],
    [leftDotX + 0.35,    3.5,               -7.1],
  ], leftDotX, 0xe6e6e6);

  // Red — to R
  makeSpeakerCable(redExit, [
    [redExit.x - 0.5, redExit.y + 0.85, redExit.z - 0.4],
    [-3.5,             2.4,              -4.7],
    [rightDotX - 0.35, 3.7,              -7.2],
  ], rightDotX, 0xb03030);
}, undefined, (err) => {
  console.error('Circuitboard.glb failed to load', err);
});

// Blend a hex colour toward white — a same-hue glow reads weakly on darker/muted
// hues (blue ROBOT, purple REVERB, gold PANNING), so hover lightens the colour
// itself rather than just adding more of it.
function lightenHex(hex, amt) {
  return new THREE.Color(hex).lerp(new THREE.Color(0xffffff), amt).getHex();
}

function setHoverState(mesh, isHover) {
  if (mesh.userData.emissiveMapGlow) {
    mesh.material.emissiveIntensity = isHover ? 1.1 : 0;
  } else {
    mesh.material.emissive.setHex(isHover ? lightenHex(mesh.userData.glowHex, 0.35) : 0x000000);
    mesh.material.emissiveIntensity = isHover ? 2.4 : 1;
  }
  if (mesh.material.transparent) {
    mesh.material.opacity = isHover
      ? Math.min(1, mesh.userData.baseOpacity + 0.45)
      : mesh.userData.baseOpacity;
  }
}

renderer.domElement.addEventListener('pointermove', e => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
  mouse.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hit = raycaster.intersectObjects(hoverTargets)[0]?.object ?? null;
  renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
  if (hit !== hoveredMesh) {
    if (hoveredMesh) setHoverState(hoveredMesh, false);
    if (hit) setHoverState(hit, true);
    hoveredMesh = hit;
  }
});

renderer.domElement.addEventListener('pointerleave', () => {
  if (hoveredMesh) {
    setHoverState(hoveredMesh, false);
    hoveredMesh = null;
  }
  renderer.domElement.style.cursor = 'default';
});

// ── Resize ─────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Animation loop ──────────────────────────────────────────────────────────
renderer.setAnimationLoop((time) => {
  // REC button breathes like an active recording light
  if (recMaterial) {
    recMaterial.emissiveIntensity = 1.4 + Math.sin(time * 0.004) * 0.7;
  }
  renderer.render(scene, camera);
});

// ── Go back to the radio ────────────────────────────────────────────────────
document.getElementById('go-back').addEventListener('click', () => {
  window.location.href = 'radio-v2.html';
});
</script>
